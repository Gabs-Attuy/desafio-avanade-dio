services:

  inventory-service:
    build:
      context: ./src/InventoryService
    container_name: inventory-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: desafio-avanadade-dio.AuthService
      Jwt__Audience: desafio-avanadade-dio

    depends_on:
      rabbitmq:
        condition: service_started
      sqlserver:
        condition: service_healthy


  sales-service:
    build:
      context: ./src/SalesService
    container_name: sales-service
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SalesDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      InventoryService__BaseUrl: http://inventory-service:8080/
      
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: desafio-avanadade-dio.AuthService
      Jwt__Audience: desafio-avanadade-dio

    depends_on:
      rabbitmq:
        condition: service_started
      sqlserver:
        condition: service_healthy


  auth-service:
    build:
      context: ./src/AuthService
    container_name: auth-service
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: desafio-avanadade-dio.AuthService
      Jwt__Audience: desafio-avanadade-dio

    depends_on:
      sqlserver:
        condition: service_healthy


  api-gateway:
    build:
      context: ./src/ApiGateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development

      ReverseProxy__Clusters__inventory-cluster__Destinations__inventory-destination__Address: http://inventory-service:8080/
      ReverseProxy__Clusters__sales-cluster__Destinations__sales-destination__Address: http://sales-service:8080/
      ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address: http://auth-service:8080/

    depends_on:
      - inventory-service
      - sales-service
      - auth-service


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  sqlserver-data: